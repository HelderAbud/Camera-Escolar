# CI — FaceLogAI

name: CI

on:
  push:
    branches: [main, Main, master]
  pull_request:

jobs:
  test:
    name: Maven tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests
        run: mvn -B test
