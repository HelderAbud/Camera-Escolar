services:
  db:
    image: mysql:8.0
    container_name: facelogai_db
    environment:
      MYSQL_DATABASE: facelogai
      MYSQL_USER: facelogai
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    ports:
      # Host 3307 — matriz portfólio (evita colisão com Tshirt-Store em 3308)
      - "3307:3306"
    volumes:
      - facelogai_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

volumes:
  facelogai_data:

