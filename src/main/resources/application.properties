spring.application.name=facelogai-backend

# Porta canônica portfólio (host)
server.port=8082

# Datasource - MySQL local (host 3307 na matriz portfólio)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/facelogai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:facelogai}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret-base64=${JWT_SECRET_BASE64:}

# Admin seed local/dev (desabilitado por padrão)
facelogai.seed-admin.enabled=${FACELOGAI_SEED_ADMIN_ENABLED:false}
facelogai.seed-admin.name=${FACELOGAI_SEED_ADMIN_NAME:Administrador}
facelogai.seed-admin.email=${FACELOGAI_SEED_ADMIN_EMAIL:admin@facelogai.local}
facelogai.seed-admin.password=${FACELOGAI_SEED_ADMIN_PASSWORD:}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

